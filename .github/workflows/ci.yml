name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Smoke run (simulated backend, no API key)
        run: |
          if python -c "import evorg.cli" 2>/dev/null; then
            evorg run --backend sim --generations 2 --population 4 --seed 0 --out runs/ci
          else
            echo "CLI not built yet; skipping smoke run"
          fi
